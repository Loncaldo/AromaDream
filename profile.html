<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Профиль</title>

    <link rel="icon" type="image/png" href="media/favicon.png">
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>
        <nav>

            <div class="logo">
                <a href="https://yandex.ru">
                    <img src="media/yandex.png"
                        alt="Яндекс">
                </a>
            </div>
            
            <div class="logo">
                <a href="index.html"><img src="media/logohibryd.png"></a>
            </div>

            <div class="nav-links">
                <a href="index.html"><img src="media/homeicon.png" alt="home_icon"></a>
                <a href="catalog.html"><img src="media/catalogicon.png" alt="catalog_icon"></a>
                <a href="about.html"><img src="media/teamicon.png" alt="AromaDream_team_icon"></a>
                <a href="contacts.html"><img src="media/supporticon.png" alt="support_icon"></a>
                <a href="profile.html"><img src="media/profileicon.png" alt="profile_icon"></a>
            </div>
        </nav>

        <button class="burger-btn" id="burgerBtn">
            ☰
        </button>

        <div class="overlay" id="overlay"></div>

        <div class="sidebar" id="sidebar">

            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="about.html">О нас</a>
            <a href="profile.html">Профиль</a>
            <a href="contacts.html">Контакты</a>

        </div>
    </header>

    <section class="section">

        <h2 class="section-title">Личный кабинет</h2>

        <div class="contact-box">

            <form id="registerForm">

                <input type="text"
                       id="username"
                       placeholder="Логин"
                       required>

                <input type="email"
                       id="email"
                       placeholder="Email"
                       required>

                <input type="password"
                       id="password"
                       placeholder="Пароль"
                       required>

                <button type="submit">
                    Зарегистрироваться
                </button>

            </form>

        </div>

        <div id="profileInfo"></div>

    </section>

    <footer>

        <p>
            © 2026 AromaDream |
            Email: example@aromadream.com |
            +7 (000) 000-00-00
        </p>

        <br>

        <p>Автор: Амиров М. М.</p>

        <div class="footer-scripts">
            <div id="clock"></div>
            <div id="counter"></div>
        </div>

    </footer>

    <script src="Time.js"></script>
    <script src="Burger.js"></script>
    <script src="profile.js"></script>

</body>
</html>
